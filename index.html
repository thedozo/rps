<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors - Chaos Simulation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #111;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #controls {
            position: absolute;
            top: 15px;
            z-index: 10;
            background: rgba(20, 20, 20, 0.85);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #333;
        }
        button {
            background: #e63946;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover {
            background: #ff4d5a;
            transform: scale(1.05);
        }
        #scoreboard {
            display: flex;
            gap: 20px;
            font-size: 1.1rem;
            font-weight: 600;
        }
        .score-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="controls">
        <button id="resetBtn">Reset Chaos</button>
        <div id="scoreboard">
            <div class="score-item">🪨 <span id="rockCount">0</span></div>
            <div class="score-item">📄 <span id="paperCount">0</span></div>
            <div class="score-item">✂️ <span id="scissorsCount">0</span></div>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Target settings
        const PARTICLE_COUNT = 300;
        const PARTICLE_SIZE = 14; 
        const MAX_SPEED = 4;
        const CHAOS_FACTOR = 0.3; // Sudden random steering forces
        const ATTRACTION_FORCE = 0.05; // Soft gravity toward opposing species

        const TYPES = {
            ROCK: { emoji: '🪨', color: '#ffb703' },
            PAPER: { emoji: '📄', color: '#219ebc' },
            SCISSORS: { emoji: '✂️', color: '#fb8500' }
        };

        const TYPE_KEYS = Object.keys(TYPES);
        let particles = [];

        // Adjust Canvas to match viewport size
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.radius = PARTICLE_SIZE;
                
                // Random starting velocity vectors
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            update() {
                // Apply chaotic jitter (Brownian-like perturbation)
                this.vx += (Math.random() - 0.5) * CHAOS_FACTOR;
                this.vy += (Math.random() - 0.5) * CHAOS_FACTOR;

                // Move particle
                this.x += this.vx;
                this.y += this.vy;

                // Speed limit constraints
                const speed = Math.hypot(this.vx, this.vy);
                if (speed > MAX_SPEED) {
                    this.vx = (this.vx / speed) * MAX_SPEED;
                    this.vy = (this.vy / speed) * MAX_SPEED;
                }

                // Bounce off screen boundaries
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
                if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
                if (this.y + this.radius > canvas.height) { this.y = canvas.height - this.radius; this.vy *= -1; }
            }

            draw() {
                ctx.save();
                ctx.font = `${this.radius * 2}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(TYPES[this.type].emoji, this.x, this.y);
                ctx.restore();
            }

            // Determines what this particle wants to hunt down
            getPrey() {
                if (this.type === 'ROCK') return 'SCISSORS';
                if (this.type === 'PAPER') return 'ROCK';
                if (this.type === 'SCISSORS') return 'PAPER';
            }
        }

        function initSimulation() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const x = Math.random() * (canvas.width - PARTICLE_SIZE * 2) + PARTICLE_SIZE;
                const y = Math.random() * (canvas.height - PARTICLE_SIZE * 2) + PARTICLE_SIZE;
                const type = TYPE_KEYS[i % 3];
                particles.push(new Particle(x, y, type));
            }
        }

        function resolveInteractions() {
            let counts = { ROCK: 0, PAPER: 0, SCISSORS: 0 };

            for (let i = 0; i < particles.length; i++) {
                const p1 = particles[i];
                counts[p1.type]++;

                // Find closest prey to gravitate towards (adding structure to chaos)
                let closestPrey = null;
                let minDist = Infinity;
                const targetPreyType = p1.getPrey();

                for (let j = 0; j < particles.length; j++) {
                    if (i === j) continue;
                    const p2 = particles[j];
                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.hypot(dx, dy);

                    // Check for overlap/collision
                    if (dist < p1.radius + p2.radius) {
                        handleCollision(p1, p2);
                    }

                    // Keep track of nearest target
                    if (p2.type === targetPreyType && dist < minDist) {
                        minDist = dist;
                        closestPrey = p2;
                    }
                }

                // Smooth attraction movement toward target prey
                if (closestPrey && minDist < 250) {
                    p1.vx += ((closestPrey.x - p1.x) / minDist) * ATTRACTION_FORCE;
                    p1.vy += ((closestPrey.y - p1.y) / minDist) * ATTRACTION_FORCE;
                }
            }

            // Update UI Scoreboard
            document.getElementById('rockCount').innerText = counts.ROCK;
            document.getElementById('paperCount').innerText = counts.PAPER;
            document.getElementById('scissorsCount').innerText = counts.SCISSORS;
        }

        function handleCollision(p1, p2) {
            if (p1.type === p2.type) return;

            // Classic rules logic
            if (
                (p1.type === 'ROCK' && p2.type === 'SCISSORS') ||
                (p1.type === 'PAPER' && p2.type === 'ROCK') ||
                (p1.type === 'SCISSORS' && p2.type === 'PAPER')
            ) {
                p2.type = p1.type; // p1 wins, converts p2
            } else {
                p1.type = p2.type; // p2 wins, converts p1
            }
        }

        function animate() {
            // Semi-transparent background refresh creates a faint motion blur trail
            ctx.fillStyle = 'rgba(17, 17, 17, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            resolveInteractions();

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // Hook up Control actions
        document.getElementById('resetBtn').addEventListener('click', initSimulation);

        // Run
        initSimulation();
        animate();
    </script>
</body>
</html>
